<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentación</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ffffff;
    }

    #slider-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .slide-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: none;
    }

    .slide-img.active {
      display: block;
    }

    /* Botones de navegación transparentes en los bordes */
    .nav-btn {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 20%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      outline: none;
      color: rgba(255, 255, 255, 0.15);
      font-size: 32px;
      cursor: pointer;
      transition: color 0.2s ease, background 0.2s ease;
      z-index: 10;
    }

    .nav-btn:hover {
      color: rgba(255, 255, 255, 0.8);
      background: linear-gradient(to right, rgba(0,0,0,0.4), transparent);
    }

    .nav-btn.next:hover {
      background: linear-gradient(to left, rgba(0,0,0,0.4), transparent);
    }

    .nav-btn.prev { left: 0; }
    .nav-btn.next { right: 0; }

    /* Indicador de número de diapositiva */
    #counter {
      position: absolute;
      bottom: 16px;
      background: rgba(0, 0, 0, 0.5);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(4px);
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div id="slider-container">
    <button class="nav-btn prev" id="prev-btn"><i class="fa-solid fa-chevron-left"></i></button>
    
    <div id="slides-wrapper" style="width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;">
      <!-- Agrega o quita las líneas <img> según la cantidad de imágenes que tengas -->
      <img src="1.jpg" class="slide-img active" alt="Diapositiva 1">
      <img src="2.jpg" class="slide-img" alt="Diapositiva 2">
      <img src="3.jpg" class="slide-img" alt="Diapositiva 3">
      <img src="4.jpg" class="slide-img" alt="Diapositiva 4">
    </div>
    
    <button class="nav-btn next" id="next-btn"><i class="fa-solid fa-chevron-right"></i></button>

    <div id="counter">1 / 4</div>
  </div>

  <script>
    const images = document.querySelectorAll('.slide-img');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const counter = document.getElementById('counter');

    let currentIndex = 0;
    const totalSlides = images.length;

    function showSlide(index) {
      if (totalSlides === 0) return;

      images.forEach(img => img.classList.remove('active'));

      if (index >= totalSlides) currentIndex = 0;
      else if (index < 0) currentIndex = totalSlides - 1;
      else currentIndex = index;

      images[currentIndex].classList.add('active');
      updateCounter();
    }

    function updateCounter() {
      counter.textContent = `${currentIndex + 1} / ${totalSlides}`;
    }

    prevBtn.addEventListener('click', () => showSlide(currentIndex - 1));
    nextBtn.addEventListener('click', () => showSlide(currentIndex + 1));

    // Soporte para gestos táctiles (Swipe en celulares)
    let startX = 0;
    document.addEventListener('touchstart', e => { startX = e.touches[0].clientX; });
    document.addEventListener('touchend', e => {
      let endX = e.changedTouches[0].clientX;
      if (startX - endX > 50) showSlide(currentIndex + 1); // Swipe izquierda -> siguiente
      if (endX - startX > 50) showSlide(currentIndex - 1); // Swipe derecha -> anterior
    });

    // Soporte para teclado
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') showSlide(currentIndex - 1);
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') showSlide(currentIndex + 1);
    });

    updateCounter();
  </script>
</body>
</html>
